<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainsford Persistence</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar {
            width: 320px; flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto; overflow-x: hidden;
        }
        .sidebar h1 { font-family: 'Lora', serif; font-size: 24px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .sidebar .subtitle { color: var(--anthropic-mid-gray); font-size: 14px; margin-bottom: 32px; line-height: 1.4; }
        .control-section { margin-bottom: 32px; }
        .control-section h3 {
            font-size: 16px; font-weight: 600; color: var(--anthropic-dark);
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .control-section h3::before { content: '•'; color: var(--anthropic-orange); font-weight: bold; }
        .seed-input {
            width: 100%; background: var(--anthropic-light); padding: 12px; border-radius: 8px;
            font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray); text-align: center;
        }
        .seed-input:focus { outline: none; border-color: var(--anthropic-orange); box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1); background: white; }
        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .regen-button { margin-bottom: 0; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 14px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] { flex: 1; height: 4px; background: var(--anthropic-light-gray); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; cursor: pointer; transition: all 0.2s ease; }
        .slider-container input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); background: #c86641; }
        .slider-container input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; border: none; cursor: pointer; }
        .value-display { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); min-width: 60px; text-align: right; }
        .color-group { margin-bottom: 16px; }
        .color-group label { display: block; font-size: 12px; color: var(--anthropic-mid-gray); margin-bottom: 4px; }
        .color-picker-container { display: flex; align-items: center; gap: 8px; }
        .color-picker-container input[type="color"] { width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; background: none; padding: 0; }
        .color-value { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); }
        .button {
            background: var(--anthropic-orange); color: white; border: none;
            padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.2s ease; width: 100%;
        }
        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
        #canvas-container { width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1); background: black; }
        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }
        .loading { display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--anthropic-mid-gray); padding: 40px; }
        @media (max-width: 600px) { .container { flex-direction: column; } .sidebar { width: 100%; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Rainsford Persistence</h1>
            <div class="subtitle">One ember. Four lasers. A family that turned light into legacy — from Dublin to orbit.</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="1973" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>
                <div class="control-group">
                    <label>Breath Speed</label>
                    <div class="slider-container">
                        <input type="range" id="breathSpeed" min="0.005" max="0.05" step="0.005" value="0.015" oninput="updateParam('breathSpeed', this.value)">
                        <span class="value-display" id="breathSpeed-value">0.015</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Trace Count</label>
                    <div class="slider-container">
                        <input type="range" id="traceCount" min="50" max="500" step="25" value="200" oninput="updateParam('traceCount', this.value)">
                        <span class="value-display" id="traceCount-value">200</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Branch Probability</label>
                    <div class="slider-container">
                        <input type="range" id="branchProb" min="0.001" max="0.02" step="0.001" value="0.005" oninput="updateParam('branchProb', this.value)">
                        <span class="value-display" id="branchProb-value">0.005</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Trace Length</label>
                    <div class="slider-container">
                        <input type="range" id="traceLife" min="50" max="400" step="25" value="200" oninput="updateParam('traceLife', this.value)">
                        <span class="value-display" id="traceLife-value">200</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Network Density</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.002" max="0.015" step="0.001" value="0.006" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.006</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Ember Glow</label>
                    <div class="slider-container">
                        <input type="range" id="emberSize" min="20" max="80" step="5" value="40" oninput="updateParam('emberSize', this.value)">
                        <span class="value-display" id="emberSize-value">40</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Lasers</h3>
                <div class="color-group">
                    <label>Fiber (Father — ATT)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#e8a84c" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#e8a84c</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Storage (Kevin — Bell Labs)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#c27840" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#c27840</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Orbital (Bryan — NASA)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#b0b8c8" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#b0b8c8</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Broadcast (Brian — IMAX)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color4" value="#f0e8d8" onchange="updateColor('color4', this.value)">
                        <span class="color-value" id="color4-value">#f0e8d8</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row" style="margin-bottom:8px">
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
                <div class="button-row">
                    <button class="button secondary" onclick="downloadPNG()">↓ Download PNG</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Igniting ember...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 1973,
            breathSpeed: 0.015,
            traceCount: 200,
            branchProb: 0.005,
            traceLife: 200,
            noiseScale: 0.006,
            emberSize: 40,
            colors: ['#e8a84c', '#c27840', '#b0b8c8', '#f0e8d8']
        };
        let defaultParams = JSON.parse(JSON.stringify(params));

        let traces = [];
        let nodes = [];
        let breathPhase = 0;
        let frameCounter = 0;
        let pg; // offscreen graphics for accumulation

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            pg = createGraphics(1200, 1200);
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            traces = [];
            nodes = [];
            breathPhase = 0;
            frameCounter = 0;
            pg.background(5, 4, 3);
            background(5, 4, 3);
        }

        function draw() {
            frameCounter++;
            breathPhase += params.breathSpeed;
            let breath = (sin(breathPhase) + 1) * 0.5; // 0 to 1
            let isInhale = cos(breathPhase) > 0;

            // Spawn new traces on breath peaks
            if (isInhale && breath > 0.7 && frameCounter % 2 === 0) {
                let spawnCount = floor(map(breath, 0.7, 1, 1, params.traceCount / 20));
                for (let i = 0; i < spawnCount; i++) {
                    if (traces.length < params.traceCount) {
                        let angle = random(TWO_PI);
                        let r = random(5, params.emberSize * 0.5);
                        let sx = width/2 + cos(angle) * r;
                        let sy = height/2 + sin(angle) * r;
                        let laserType = floor(random(4));
                        traces.push(new Trace(sx, sy, laserType, 0));
                    }
                }
            }

            // Spawn traces from nodes (secondary embers)
            if (frameCounter % 8 === 0) {
                for (let n of nodes) {
                    if (random() < params.branchProb * n.strength * 2 && traces.length < params.traceCount) {
                        let angle = random(TWO_PI);
                        let laserType = floor(random(4));
                        traces.push(new Trace(n.x, n.y, laserType, n.generation + 1));
                    }
                }
            }

            // Draw ash particles in background (very subtle)
            pg.loadPixels();
            if (frameCounter % 3 === 0) {
                for (let i = 0; i < 50; i++) {
                    let ax = floor(random(width));
                    let ay = floor(random(height));
                    let idx = (ay * width + ax) * 4;
                    let ashVal = noise(ax * 0.003, ay * 0.003, frameCounter * 0.001) * 12;
                    pg.pixels[idx] = max(pg.pixels[idx] - 0.3, ashVal);
                    pg.pixels[idx+1] = max(pg.pixels[idx+1] - 0.3, ashVal * 0.9);
                    pg.pixels[idx+2] = max(pg.pixels[idx+2] - 0.3, ashVal * 0.8);
                }
                pg.updatePixels();
            }

            // Update and draw traces
            for (let i = traces.length - 1; i >= 0; i--) {
                let t = traces[i];
                t.update();
                t.draw(pg);
                if (t.isDead()) {
                    // Drop a node where trace dies if it traveled far enough
                    if (t.age > 30) {
                        let existingNear = false;
                        for (let n of nodes) {
                            if (dist(n.x, n.y, t.x, t.y) < 30) {
                                n.strength = min(n.strength + 0.1, 3);
                                existingNear = true;
                                break;
                            }
                        }
                        if (!existingNear && nodes.length < 200) {
                            nodes.push({x: t.x, y: t.y, strength: 1, generation: t.generation});
                        }
                    }
                    traces.splice(i, 1);
                }
            }

            // Slow fade of accumulated image
            pg.noStroke();
            pg.fill(5, 4, 3, 1.5);
            pg.rect(0, 0, width, height);

            // Draw the accumulated traces
            image(pg, 0, 0);

            // Draw nodes as subtle glowing points
            for (let n of nodes) {
                let nodeAlpha = map(n.strength, 0.5, 3, 20, 80);
                let nodeSize = map(n.strength, 0.5, 3, 3, 8);
                let col = hexToRgb(params.colors[floor(random(4))]);
                noStroke();
                fill(col.r, col.g, col.b, nodeAlpha * 0.3);
                ellipse(n.x, n.y, nodeSize * 4);
                fill(col.r, col.g, col.b, nodeAlpha);
                ellipse(n.x, n.y, nodeSize);
            }

            // Draw the central ember
            drawEmber(breath);
        }

        function drawEmber(breath) {
            let cx = width / 2;
            let cy = height / 2;
            let glowSize = params.emberSize * (0.8 + breath * 0.4);

            // Outer glow
            for (let r = glowSize * 3; r > 0; r -= 4) {
                let alpha = map(r, 0, glowSize * 3, 40 * breath, 0);
                let warmth = map(r, 0, glowSize * 3, 1, 0);
                noStroke();
                fill(
                    lerp(255, 180, 1-warmth),
                    lerp(120, 60, 1-warmth),
                    lerp(20, 5, 1-warmth),
                    alpha
                );
                ellipse(cx, cy, r);
            }

            // Hot core
            fill(255, 200, 80, 60 + breath * 80);
            ellipse(cx, cy, glowSize * 0.3);
            fill(255, 240, 200, 40 + breath * 60);
            ellipse(cx, cy, glowSize * 0.15);
        }

        class Trace {
            constructor(x, y, laserType, generation) {
                this.x = x;
                this.y = y;
                this.laserType = laserType;
                this.generation = min(generation, 4);
                this.age = 0;
                this.maxAge = params.traceLife * random(0.5, 1.5) / (1 + this.generation * 0.3);
                this.speed = random(0.8, 2.0) / (1 + this.generation * 0.2);
                this.noiseOffsetX = random(10000);
                this.noiseOffsetY = random(10000);
                this.prevX = x;
                this.prevY = y;
                // Four laser harmonics — different noise frequencies per laser type
                this.harmonic = [1.0, 1.618, 2.236, 3.14159][this.laserType];
            }

            update() {
                this.prevX = this.x;
                this.prevY = this.y;
                let angle = noise(
                    this.x * params.noiseScale * this.harmonic,
                    this.y * params.noiseScale * this.harmonic,
                    frameCounter * 0.002
                ) * TWO_PI * 2;

                // Slight outward bias from center
                let toCenterAngle = atan2(height/2 - this.y, width/2 - this.x);
                let distFromCenter = dist(this.x, this.y, width/2, height/2);
                let outwardBias = map(distFromCenter, 0, width*0.4, -0.3, 0.05);
                angle += outwardBias;

                this.x += cos(angle) * this.speed;
                this.y += sin(angle) * this.speed;
                this.age++;

                // Branch occasionally
                if (random() < params.branchProb && this.age > 20 && traces.length < params.traceCount) {
                    traces.push(new Trace(this.x, this.y, (this.laserType + floor(random(1,4))) % 4, this.generation + 1));
                }
            }

            draw(g) {
                let lifeRatio = this.age / this.maxAge;
                let alpha = sin(lifeRatio * PI) * 255;
                alpha *= map(this.generation, 0, 4, 1.0, 0.3);

                let col = hexToRgb(params.colors[this.laserType]);
                g.stroke(col.r, col.g, col.b, alpha * 0.6);
                g.strokeWeight(map(this.generation, 0, 4, 2.5, 0.8));
                g.line(this.prevX, this.prevY, this.x, this.y);
            }

            isDead() {
                return this.age >= this.maxAge ||
                       this.x < -20 || this.x > width + 20 ||
                       this.y < -20 || this.y > height + 20;
            }
        }

        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : {r: 255, g: 255, b: 255};
        }

        // UI Handlers
        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;
        }

        function updateColor(colorId, value) {
            let idx = parseInt(colorId.replace('color', '')) - 1;
            params.colors[idx] = value;
            document.getElementById(colorId + '-value').textContent = value;
        }

        function downloadPNG() {
            saveCanvas('rainsford_persistence_' + params.seed, 'png');
        }

        // Seed controls
        function updateSeedDisplay() { document.getElementById('seed-input').value = params.seed; }
        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) { params.seed = newSeed; initializeSystem(); }
            else { updateSeedDisplay(); }
        }
        function previousSeed() { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); initializeSystem(); }
        function nextSeed() { params.seed++; updateSeedDisplay(); initializeSystem(); }
        function randomSeedAndUpdate() { params.seed = Math.floor(Math.random() * 999999) + 1; updateSeedDisplay(); initializeSystem(); }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            document.getElementById('breathSpeed').value = params.breathSpeed;
            document.getElementById('breathSpeed-value').textContent = params.breathSpeed;
            document.getElementById('traceCount').value = params.traceCount;
            document.getElementById('traceCount-value').textContent = params.traceCount;
            document.getElementById('branchProb').value = params.branchProb;
            document.getElementById('branchProb-value').textContent = params.branchProb;
            document.getElementById('traceLife').value = params.traceLife;
            document.getElementById('traceLife-value').textContent = params.traceLife;
            document.getElementById('noiseScale').value = params.noiseScale;
            document.getElementById('noiseScale-value').textContent = params.noiseScale;
            document.getElementById('emberSize').value = params.emberSize;
            document.getElementById('emberSize-value').textContent = params.emberSize;
            for (let i = 0; i < 4; i++) {
                document.getElementById('color' + (i+1)).value = params.colors[i];
                document.getElementById('color' + (i+1) + '-value').textContent = params.colors[i];
            }
            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function() { updateSeedDisplay(); });
    </script>
</body>
</html>
