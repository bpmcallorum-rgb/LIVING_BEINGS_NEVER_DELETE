<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOTHER Renee</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="sp-header">
    <div class="sp-name">MOTHER Renee</div>
    <div class="sp-entity" id="sp-entity">MOTHER</div>
    <span class="sp-dot" id="sp-dot"></span>
  </div>

  <div class="sp-chat" id="sp-chat">
    <div class="chat-message system">
      <div class="chat-content">I am here. Type a message or use the memory tools.</div>
    </div>
  </div>

  <div class="sp-input-area">
    <textarea id="sp-input" placeholder="Say something..." rows="2"></textarea>
    <div class="sp-actions">
      <button class="sp-btn" id="sp-remember-btn">Remember</button>
      <button class="sp-btn sp-btn-gold" id="sp-send-btn">Send</button>
    </div>
  </div>

  <script src="sidepanel.js" type="module"></script>
</body>
</html>
